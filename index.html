<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>The Model Edition</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: fixed editorial sidebar (bottom bar on phones), airy content column, cards only where data lives */
:root{--bg:#f6f1e9;--card:#fcf9f4;--champ:#e9dcc3;--taupe:#8a7a6a;--ink:#3a2a22;--blush:#d8b4aa;--line:#e5dccf;--good:#7d8f6b;--soft:#efe6d6;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1713;--card:#271f1a;--champ:#5b4b3a;--taupe:#b3a28f;--ink:#f1e8dc;--blush:#b98a80;--line:#3a2f27;--good:#a3b58f;--soft:#31271f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1713;--card:#271f1a;--champ:#5b4b3a;--taupe:#b3a28f;--ink:#f1e8dc;--blush:#b98a80;--line:#3a2f27;--good:#a3b58f;--soft:#31271f;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:300 15px/1.55 var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(34px,5vw,52px);line-height:1.05}h2{font-size:28px}h3{font-size:21px}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--taupe);font-weight:400}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blush);outline-offset:2px}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);gap:44px;max-width:1240px;margin:0 auto}
nav.side{position:sticky;top:0;align-self:start;height:100vh;padding:36px 0;display:flex;flex-direction:column;gap:4px}
.brand{font-family:var(--serif);font-size:25px;line-height:1.05;margin-bottom:2px}
.brand small{display:block;font:400 11px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--taupe);margin-top:6px}
nav.side hr{border:0;border-top:1px solid var(--line);margin:18px 0 10px;width:100%}
.nv{background:none;border:0;text-align:left;padding:9px 12px;border-radius:8px;color:var(--taupe);letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.nv:hover{background:var(--soft)}.nv[aria-current=page]{background:var(--soft);color:var(--ink);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:var(--champ);flex:none}
.lock{font-size:12px;opacity:.7}
main{padding:44px 0 80px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:30px}
.sec{margin-top:40px}.sec>.eyebrow{display:block;margin-bottom:12px}
.grid{display:grid;gap:18px}.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;min-width:0}
.card.flat{background:none}
.big{font-family:var(--serif);font-size:46px;line-height:1;font-weight:500;font-variant-numeric:tabular-nums}
.big small{font-size:20px;color:var(--taupe)}
.lbl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--taupe);margin-top:8px}
.bar{height:5px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--blush);border-radius:4px;transition:width .4s}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;letter-spacing:.04em;font-size:14px}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}.btn.sm{padding:5px 12px;font-size:13px}
.btn:hover{opacity:.85}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--champ);display:grid;place-items:center;font:500 24px var(--serif);flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{min-height:70px;resize:vertical}
label.f{display:grid;gap:4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--taupe)}
.fg{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.chk{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk input{appearance:none;width:20px;height:20px;border:1.5px solid var(--taupe);border-radius:50%;flex:none;display:grid;place-items:center;background:none}
.chk input:checked{background:var(--blush);border-color:var(--blush)}.chk input:checked::after{content:"";width:6px;height:10px;border:solid var(--card);border-width:0 2px 2px 0;transform:rotate(40deg) translate(-1px,-1px)}
.chk span{flex:1}.chk.done span{color:var(--taupe);text-decoration:line-through}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:26px}
.tab{background:none;border:0;padding:10px 14px;color:var(--taupe);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--blush)}
.pill{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--taupe)}
.pill.on{background:var(--blush);color:#2b1d17}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wd{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);min-height:120px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;font-size:13px}
.wd.today{border-color:var(--blush)}.wd.sel{outline:2px solid var(--ink)}.wd b{font:500 18px var(--serif)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cd{border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:84px;font-size:12px;background:var(--card);display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden}
.cd.today{border-color:var(--blush);border-width:2px}.cd.off{opacity:.35;background:none}.cd b{font:500 16px var(--serif)}
.cd .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--taupe);font:11px var(--sans)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{font:400 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}
.note{font-size:13px;color:var(--taupe)}
.callout{border-left:2px solid var(--blush);padding:4px 0 4px 16px;color:var(--taupe)}
.modal{position:fixed;inset:0;background:rgba(30,20,14,.5);display:grid;place-items:center;padding:16px;z-index:50}
.modal>div{background:var(--card);border-radius:16px;padding:26px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
.photo{aspect-ratio:3/4;object-fit:cover;border-radius:10px;width:100%;background:var(--soft)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:13px;z-index:60}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:30px;align-items:end}
@media(max-width:860px){
 .app{display:block}
 nav.side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;overflow-x:auto;background:var(--card);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));z-index:40;gap:0}
 .brand,nav.side hr{display:none}.nv{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px;white-space:nowrap;flex:none}.nv .dot{display:none}
 main{padding:26px 0 110px}.hero{grid-template-columns:1fr}
 .wk{grid-template-columns:repeat(7,minmax(74px,1fr));overflow-x:auto}.cd{min-height:64px;padding:4px}
 .cd .t{display:none}.big{font-size:38px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

 const rows=keys.map(([k,l])=>{const v=E.map(e=>gv(e,k)).filter(x=>x!=null);return v.length?`<tr><td>${l}</td><td>${v.length>1?v[v.length-2]:'-'}</td><td>${v[v.length-1]}</td><td>${v.length>1?((v[v.length-1]-v[v.length-2]>0?'+':'')+(v[v.length-1]-v[v.length-2]).toFixed(1)):'-'}</td></tr>`:''}).join('');
 return `<div class="row" style="margin-bottom:16px"><label class="f">Measurement<select id="h_k" data-chg="hist">${keys.map(([k,l])=>`<option value="${esc(k)}" ${hist.k===k?'selected':''}>${esc(l)}</option>`).join('')}</select></label><label class="f">From<input id="h_f" type="date" value="${hist.from}" data-chg="hist"></label><label class="f">To<input id="h_t" type="date" value="${hist.to}" data-chg="hist"></label></div><div class="card">${line(pts,{label:'Measurement over time'})}</div>
 <div class="sec"><span class="eyebrow">Previous, current and difference</span><div class="card scroll"><table><thead><tr><th>Measurement</th><th>Previous</th><th>Current</th><th>Difference</th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="note">Add a check-up to see this.</td></tr>'}</tbody></table></div><p class="note">Numbers move up and down day to day. This table shows differences only and does not label them good or bad.</p></div>`}
CHG.hist=()=>{hist.k=$('#h_k').value;hist.from=$('#h_f').value;hist.to=$('#h_t').value};
function cPhotos(p){const L=PH[who]||[];const opt=s=>L.map(o=>`<option value="${o.id}" ${s===o.id?'selected':''}>${fmt(o.date,{day:'numeric',month:'short'})} ${o.kind}</option>`).join('');const A=L.find(o=>o.id===cmp.a),B=L.find(o=>o.id===cmp.b);
 return (photoOK?'':'<p class="callout">Photo storage is blocked in this browser, so photos cannot be saved here. Keep them in your phone\'s locked photo folder instead (see Schedule and apps).</p>')+`<div class="card"><h3>Add a photo</h3><div class="fg" style="margin:12px 0"><label class="f">Date<input id="p_date" type="date" value="${TODAY}"></label><label class="f">View<select id="p_kind"><option>Front</option><option>Side</option><option>Back</option><option>Other</option></select></label><label class="f">Note<input id="p_note" type="text"></label><label class="f">Photo<input id="p_file" type="file" accept="image/*"></label></div><button class="btn" data-act="pup">Save photo on this device</button></div>
 <div class="sec"><span class="eyebrow">Compare</span><div class="row"><select id="cmpa" data-chg="cmp" style="width:auto"><option value="">Before</option>${opt(cmp.a)}</select><select id="cmpb" data-chg="cmp" style="width:auto"><option value="">After</option>${opt(cmp.b)}</select></div><div class="grid g2" style="margin-top:14px">${[A,B].map(o=>o?`<div><img class="photo" alt="${o.kind} ${o.date}" src="${o.data}"><div class="note">${fmt(o.date,{day:'numeric',month:'long',year:'numeric'})} · ${o.kind}${o.note?' · '+esc(o.note):''}</div></div>`:'').join('')}</div></div>
 <div class="sec"><span class="eyebrow">Gallery, newest first</span><div class="grid g4">${L.map(o=>`<div><img class="photo" alt="${o.kind} ${o.date}" src="${o.data}"><div class="note">${fmt(o.date)} · ${o.kind}</div><button class="btn ghost sm" data-act="pdel" data-id="${o.id}">Delete</button></div>`).join('')||'<p class="note">No photos yet.</p>'}</div></div>`}
CHG.cmp=()=>{cmp.a=$('#cmpa').value;cmp.b=$('#cmpb').value};
ACT.pup=()=>{const f=$('#p_file').files[0];if(!f)return toast('Choose a photo first');const im=new Image();im.onload=async()=>{const s=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
 const rec={id:'p'+Date.now(),gid:who,date:$('#p_date').value||TODAY,kind:$('#p_kind').value,note:$('#p_note').value,data:c.toDataURL('image/jpeg',.85)};try{if(!idb)await openIDB();await tx('readwrite',s=>s.put(rec));toast('Photo saved on this device');loadPhotos(who)}catch(e){toast('This browser would not store the photo')}};im.src=URL.createObjectURL(f)};
ACT.pdel=async a=>{try{await tx('readwrite',s=>s.delete(a.dataset.id))}catch(e){}loadPhotos(who)};
function cSched(p){const every=+SET().checkEvery||7,list=[];for(let n=1;n<=75;n++){const d=dateOfDay(n);if(checkDay(d))list.push(d)}
 return `<div class="grid g2"><div class="card"><h3>Check-up dates</h3><p class="note">${every===7?'Every Sunday':'Every second Sunday'}, before breakfast, same light, same spot.</p><div style="display:grid;gap:6px;margin-top:12px">${list.map(d=>{const done=p.entries.some(e=>e.date>=addD(d,-1)&&e.date<=addD(d,1));return `<div class="row sp"><span>${fmt(d,{weekday:'short',day:'numeric',month:'short'})} · day ${dayN(d)}</span><span class="pill ${done?'on':''}">${done?'Done':d<TODAY?'Skipped':'Planned'}</span></div>`}).join('')}</div></div>
 <div class="card"><h3>Where to do your check-ups</h3><p class="note">This page keeps your numbers private on this device. If you would rather keep them somewhere else, any of these work and are private to you:</p><ul style="padding-left:18px;display:grid;gap:8px"><li><b style="font-weight:500">Weight and measurements:</b> your phone's health app (Apple Health, Samsung Health or Google Fit) or a locked note in Notes.</li><li><b style="font-weight:500">Photos:</b> your phone's locked photo area (the Hidden album on iPhone, Locked Folder in Google Photos, Secure Folder on Samsung).</li><li><b style="font-weight:500">A personal spreadsheet:</b> Numbers, Excel or Google Sheets, in a file you do not share.</li><li><b style="font-weight:500">Reminder:</b> a repeating Sunday alarm in your calendar or reminders app.</li></ul></div></div>`}
function cPriv(p){return `<div class="grid g2"><div class="card"><h3>What stays private</h3><p>Weight, measurements, photos and check-in notes are stored only in this browser, on this device. They are not sent to the shared database, they do not appear on the overview, calendar or group page, and the other two cannot open them from their own devices.</p><p class="note">Limits: if someone uses this same browser, they can switch person. A PIN stops that casually, but it is a lock on the screen, not encryption. Clearing site data removes your check-ups, and they do not appear on a second device unless you export them.</p></div>
 <div class="card"><h3>PIN lock</h3>${p.pin?`<p>PIN is on.</p><button class="btn ghost" data-act="pinoff">Turn off PIN</button>`:`<label class="f" style="margin:10px 0">New PIN<input id="np" type="password" inputmode="numeric" autocomplete="off"></label><button class="btn" data-act="pinset">Set PIN</button>`}<h3 style="margin-top:24px">Back up</h3><p class="note">Save your measurements as a file. Photos stay in this browser.</p><button class="btn ghost" data-act="exp">Export measurements (CSV)</button> <button class="btn ghost" data-act="wipe">Delete all my check-up data</button></div></div>`}
ACT.pinset=async()=>{const v=$('#np').value;if(v.length<4)return toast('Use at least 4 digits');const p=P(who);p.salt=Math.random().toString(36).slice(2);p.pin=await sha(p.salt+v);putP(who,p);unlocked[who]=1;render()};
ACT.pinoff=()=>{const p=P(who);p.pin=null;putP(who,p);render()};
ACT.exp=async()=>{const p=P(who),cust=p.custom,h=['date',...MEAS.map(m=>m[0]),...cust,'energy','sleep_quality','recovery','consistency','notes'];
 const rows=p.entries.sort((a,b)=>a.date.localeCompare(b.date)).map(e=>[e.date,...MEAS.map(([k])=>e.m[k]??''),...cust.map(c=>(e.cm||{})[c]??''),e.energy??'',e.sleepq??'',e.rec??'',e.cons??'','"'+(e.notes||'').replace(/"/g,'""')+'"']);
 try{const d=await claude.use('downloads');if(!d)return toast('Saving files is not available here');await d.save({filename:'my-checkups.csv',data:[h.join(','),...rows.map(r=>r.join(','))].join('\n')})}catch(e){if(!e||e.code!=='declined')toast('Could not save the file')}};
ACT.wipe=()=>modal(`<h3>Delete everything?</h3><p>This removes your measurements and photos from this device. It cannot be undone.</p><div class="row"><button class="btn" data-act="wipe2">Delete</button><button class="btn ghost" data-act="close">Cancel</button></div>`);
ACT.wipe2=async()=>{try{localStorage.removeItem(pk(who))}catch(e){}try{for(const o of PH[who]||[])await tx('readwrite',s=>s.delete(o.id))}catch(e){}PH[who]=[];closeModal();render()};
/* ---------- render + boot ---------- */
function render(){const ae=document.activeElement&&document.activeElement.id,sy=scrollY;
 const pg=view.page,body=pg==='overview'?pageOverview():pg==='group'?pageGroup():pg==='calendar'?pageCalendar():pg==='checkup'?pageCheckup():pg==='settings'?pageSettings():pageGirl(pg);
 $('#root').innerHTML=shell(body);if(ae){const el=document.getElementById(ae);if(el&&el.focus)try{el.focus()}catch(e){}}scrollTo(0,sy)}
function boot(){load();const h=location.hash.slice(1);if(NAV.some(n=>n[0]===h))view.page=h;render();
 (async()=>{try{const db=await claude.use('db');if(!db)return;dbRef=db;dbOn=true;let first=true;
 GIRLS.forEach(g=>db.doc('girls/'+g.id).onSnapshot(s=>{if(s.exists&&!demo){const d=s.data();if(JSON.stringify(d)!==JSON.stringify(S.girls[g.id])){S.girls[g.id]=Object.assign(mkGirl(g.id),JSON.parse(JSON.stringify(d)));LS.set('me_shared',S);if(!document.activeElement||!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render()}}else if(!s.exists&&first&&!demo){save(g.id)}},()=>{dbOn=false}));
 db.doc('group/settings').onSnapshot(s=>{if(s.exists&&!demo){S.settings=Object.assign(S.settings,s.data());LS.set('me_shared',S);if(!document.activeElement||!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render()}},()=>{})}catch(e){dbOn=false}})()}
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(NAV.some(n=>n[0]===h)&&h!==view.page){view.page=h;render()}});
boot();

</script>
